name: Generate GitHub Snake

on:
  schedule:
    - cron: "0 */12 * * *"  # A cada 12 horas
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v3

      - name: Geração do Snake em SVG (tema escuro)
        uses: Platane/snk@v3
        with:
          github_user_name: Mathszfel
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?color_snake=%2300b894&color_dots=#222,#0b3d2e,#00b894,#ffffff

      - name: Enviar animação para o branch output
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
